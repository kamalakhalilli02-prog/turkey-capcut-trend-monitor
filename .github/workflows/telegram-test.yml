name: Telegram Connection Test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = json.dumps({
              "chat_id": chat_id,
              "text": "Salam! CapCut Turkey Trend Monitor botu GitHub-a uğurla qoşuldu. Test tamamlandı!"
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read())

          if not result.get("ok"):
              raise Exception("Telegram mesajı göndərilmədi.")

          print("Telegram test uğurludur!")
          PY
          
